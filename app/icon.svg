<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark glass fill: deep charcoal with slight cool tint -->
    <radialGradient id="glass" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#1a1c20"/>
      <stop offset="55%" stop-color="#0d0e10"/>
      <stop offset="100%" stop-color="#070809"/>
    </radialGradient>

    <!-- Soft specular rim (top-left catch light) -->
    <radialGradient id="spec" cx="34%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Edge rim glow -->
    <linearGradient id="rim" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#e8eef8" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#9aa3b2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c8d0dc" stop-opacity="0.42"/>
    </linearGradient>

    <!-- Strand chromatic stack -->
    <linearGradient id="strandCore" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="82%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="strandCyan" x1="8" y1="28" x2="56" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ec8ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#7ad4ff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#9ae8ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6ec8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="strandWarm" x1="8" y1="36" x2="56" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8a4c" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff7a3a" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ffb078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff8a4c" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-80%" width="180%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="halo" x="-50%" y="-120%" width="200%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <clipPath id="orb">
      <circle cx="32" cy="32" r="31"/>
    </clipPath>
  </defs>

  <!-- Orb body -->
  <circle cx="32" cy="32" r="31" fill="url(#glass)"/>
  <circle cx="32" cy="32" r="31" fill="url(#spec)"/>
  <circle cx="32" cy="32" r="30.25" stroke="url(#rim)" stroke-width="1.1" opacity="0.9"/>

  <g clip-path="url(#orb)">
    <!-- Soft ambient halo under the strand -->
    <path
      d="M6 33.5 C14 28.5, 22 38.5, 32 32.2 S50 25.5, 58 33"
      stroke="#ffffff"
      stroke-width="7"
      stroke-linecap="round"
      opacity="0.08"
      filter="url(#halo)"
    />

    <!-- Warm chromatic fringe (bottom) -->
    <path
      d="M7 34.4 C15 29.4, 23 39.4, 32 33.1 S49 26.4, 57 34"
      stroke="url(#strandWarm)"
      stroke-width="3.2"
      stroke-linecap="round"
      opacity="0.9"
      filter="url(#softGlow)"
    />

    <!-- Cool chromatic fringe (top) -->
    <path
      d="M7 31.6 C15 26.6, 23 36.6, 32 30.3 S49 23.6, 57 31.2"
      stroke="url(#strandCyan)"
      stroke-width="2.8"
      stroke-linecap="round"
      opacity="0.95"
      filter="url(#softGlow)"
    />

    <!-- Bright white core -->
    <path
      d="M7 33 C15 28, 23 38, 32 31.7 S49 25, 57 32.6"
      stroke="url(#strandCore)"
      stroke-width="1.85"
      stroke-linecap="round"
      filter="url(#softGlow)"
    />

    <!-- Hot core highlight -->
    <path
      d="M16 32.2 C22 29.2, 27 36.2, 32 31.8 S42 27.2, 48 32"
      stroke="#ffffff"
      stroke-width="0.7"
      stroke-linecap="round"
      opacity="0.95"
    />
  </g>
</svg>
